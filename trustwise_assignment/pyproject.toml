[project]
name = "trustwise-policy-engine"
version = "0.1.0"
description = "A policy engine with LLM judges and reproducible evaluation."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
